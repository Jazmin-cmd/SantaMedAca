
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: santamed_app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    networks:
      - santamed_net
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    container_name: santamed_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: santamed
      MYSQL_USER: santamed_user
      MYSQL_PASSWORD: santamed_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "33061:3306"
    volumes:
      - santamed_db_data:/var/lib/mysql
    networks:
      - santamed_net

  redis:
    image: redis:alpine
    container_name: santamed_redis
    ports:
      - "6379:6379"
    networks:
      - santamed_net

networks:
  santamed_net:
    driver: bridge

volumes:
  santamed_db_data: