global
    log stdout format raw local0

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend http_front
    bind *:80
    default_backend apps

backend apps
    balance roundrobin
    option httpchk GET /up
    server app_a app_a:80 check
    server app_b app_b:80 check

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 10s
